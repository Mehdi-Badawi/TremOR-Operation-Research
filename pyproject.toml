[project]
name = "tremor-screen"
version = "0.1.0"
description = "Research prototype: AI-assisted hammer-tap screening for concrete delamination"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.26", "matplotlib>=3.6"]

[project.scripts]
tremor-screen = "tremor_screen.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
