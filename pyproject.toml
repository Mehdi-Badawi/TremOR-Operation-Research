[project]
name = "tremor-screen"
version = "0.1.0"
description = "Research prototype: AI-assisted hammer-tap screening for concrete delamination"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
